[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
repository = "https://github.com/Ferza17/OkNoted"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
oknoted-core = { path = "crates/core" }
flutter_rust_bridge = "=2.13.0"
