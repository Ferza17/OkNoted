name: Rust

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain, components, and targets pinned in rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: wasm check (core)
        run: cargo check -p oknoted-core --target wasm32-unknown-unknown
      - name: wasm check (ffi)
        run: cargo check -p oknoted-ffi --target wasm32-unknown-unknown

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
