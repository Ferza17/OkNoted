[package]
name = "oknoted-ffi"
description = "OkNoted public API for Dart (flutter_rust_bridge); wires all crates together."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true

[lib]
# cargokit expects this lib name (see app/rust_builder).
name = "oknoted_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge.workspace = true
futures.workspace = true
loro = "1"
# `bundled` only affects native builds; on wasm32 rusqlite links sqlite-wasm-rs.
rusqlite = { version = "0.41", features = ["bundled"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
oknoted-net-web = { path = "../net-web" }
sqlite-wasm-rs = { version = "0.6", features = ["wasm-bindgen"] }
sqlite-wasm-vfs = { version = "0.3", features = ["sahpool"] }
wasm-bindgen-futures.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
