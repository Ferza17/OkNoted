# cargo-deny configuration: `cargo deny check`
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Fail on any RustSec advisory (vulnerable, unmaintained, unsound, yanked).
yanked = "deny"
# Unmaintained crates pulled in by Loro (ADR 0002) with no maintained release to move to.
# Re-check when upgrading loro; drop each entry once loro stops depending on it.
ignore = [
    { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill, via loro-internal -> postcard -> heapless 0.7" },
    { id = "RUSTSEC-2026-0247", reason = "bitmaps, via loro-internal -> im" },
    { id = "RUSTSEC-2026-0248", reason = "im, via loro-internal" },
    { id = "RUSTSEC-2026-0251", reason = "sized-chunks, via loro-internal -> im" },
]

[licenses]
# Licenses compatible with our MIT OR Apache-2.0 distribution.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",      # xxhash-rust (via loro), permissive
    "ISC",
    "MPL-2.0",      # im, bitmaps, sized-chunks (via loro); file-level copyleft, used unmodified
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
